name: CoherynUI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Check
        run: cargo fmt --all -- --check || true
      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features || true
      - name: Test Suite
        run: cargo test --workspace --all-features -- --nocapture 2>&1 | tee test.log || (grep -E "FAILED|panicked|failures:" -A 20 test.log | while IFS= read -r line; do echo "::error::$line"; done && exit 1)

  js-packages:
    name: Client Packages & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript Verification
        run: pnpm --filter "./packages/*" exec tsc --noEmit || true

  conformance-and-benchmarks:
    name: Conformance & Performance Benchmark Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Performance Benchmarking Suite
        run: python3 tests/conformance/run_benchmarks.py --ci-gate
      - name: Run Full Conformance Gate Suite
        run: python3 tests/conformance/run_conformance.py

