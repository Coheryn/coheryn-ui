name: CoherynUI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Check
        run: cargo fmt --all -- --check || true
      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features || true
      - name: Test Suite
        run: cargo test --workspace --all-features

  js-packages:
    name: Client Packages & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript Verification
        run: pnpm --filter "./packages/*" exec tsc --noEmit || true
