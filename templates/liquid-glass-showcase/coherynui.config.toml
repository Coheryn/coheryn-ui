# CoherynUI Project Configuration — Liquid Glass Showcase

[compiler]
layer_prefix = "cyn"
variable_prefix = "cyn"
class_prefix = ""

[theme]
default = "dark"
available = ["dark", "light"]

[tokens.radius]
sm = "0.375rem"
lg = "0.75rem"
xl = "1rem"

[themes.dark.colors]
surface = "#07090e"
surface-elevated = "#0e131f"
foreground = "#f8fafc"
brand = "#06b6d4"

[themes.light.colors]
surface = "#f0f4f8"
surface-elevated = "#ffffff"
foreground = "#0f172a"
brand = "#0891b2"
