<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoherynUI — Motion & Spring Dynamics Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="coherynui.css">
</head>
<body>

  <div class="container">
    <div>
      <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;">CoherynUI Motion Laboratory</h1>
      <p style="color: var(--cyn-color-muted); margin-top: 0.25rem;">Analytical harmonic spring dynamics & FLIP layout transitions.</p>
    </div>

    <!-- Section 1: Spring Solver -->
    <div class="card">
      <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem;">Analytical Spring Dynamics</h3>
      <div class="stage">
        <div class="spring-puck" id="puck">⚡</div>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.25rem;">
        <button class="btn btn-brand" id="triggerSpring">Animate (Target: 300px)</button>
        <button class="btn" id="resetSpring">Reset Position</button>
      </div>
    </div>

    <!-- Section 2: FLIP Transitions -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.25rem; font-weight: 700;">FLIP Layout Reordering</h3>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-brand" id="shuffleBtn">Shuffle Grid</button>
          <button class="btn" id="sortBtn">Sort Ascending</button>
        </div>
      </div>

      <div class="flip-grid" id="grid">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <script>
    // Analytical Spring Solver (RK4 closed form)
    function solveSpring(stiffness, damping, mass, target, current) {
      const w0 = Math.sqrt(stiffness / mass);
      const zeta = damping / (2 * Math.sqrt(stiffness * mass));
      const wd = w0 * Math.sqrt(1 - zeta * zeta);
      const x0 = current - target;
      return (t) => {
        const decay = Math.exp(-zeta * w0 * t);
        return target + decay * (x0 * Math.cos(wd * t) + ((zeta * w0 * x0) / wd) * Math.sin(wd * t));
      };
    }

    const puck = document.getElementById('puck');
    let posX = 0;
    let animId = null;

    document.getElementById('triggerSpring').addEventListener('click', () => {
      cancelAnimationFrame(animId);
      const solver = solveSpring(180, 18, 1.0, 320, posX);
      const start = performance.now();
      function step(now) {
        const t = (now - start) / 1000;
        posX = solver(t);
        puck.style.transform = `translate3d(${posX}px, 0, 0)`;
        if (t < 1.8) animId = requestAnimationFrame(step);
      }
      animId = requestAnimationFrame(step);
    });

    document.getElementById('resetSpring').addEventListener('click', () => {
      cancelAnimationFrame(animId);
      posX = 0;
      puck.style.transform = 'translate3d(0, 0, 0)';
    });

    // FLIP Transitions
    const grid = document.getElementById('grid');
    let items = ['01 Module', '02 Token', '03 Recipe', '04 Motion', '05 Refract', '06 Plugin', '07 Schema', '08 Deploy'];

    function renderItems() {
      grid.innerHTML = items.map((it, i) => `
        <div class="flip-item" data-id="${it}">
          <div style="font-size: 0.8rem; color: var(--cyn-color-muted);">ID: ${i + 1}</div>
          <div style="font-weight: 700; margin-top: 0.25rem;">${it}</div>
        </div>
      `).join('');
    }
    renderItems();

    function flip(fn) {
      const first = new Map();
      grid.querySelectorAll('.flip-item').forEach(el => {
        first.set(el.dataset.id, el.getBoundingClientRect());
      });

      fn();

      grid.querySelectorAll('.flip-item').forEach(el => {
        const f = first.get(el.dataset.id);
        const l = el.getBoundingClientRect();
        if (f) {
          const dx = f.left - l.left;
          const dy = f.top - l.top;
          if (dx !== 0 || dy !== 0) {
            el.style.transform = `translate(${dx}px, ${dy}px)`;
            el.style.transition = 'none';
            requestAnimationFrame(() => {
              el.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
              el.style.transform = '';
            });
          }
        }
      });
    }

    document.getElementById('shuffleBtn').addEventListener('click', () => {
      flip(() => {
        items.sort(() => Math.random() - 0.5);
        renderItems();
      });
    });

    document.getElementById('sortBtn').addEventListener('click', () => {
      flip(() => {
        items.sort();
        renderItems();
      });
    });
  </script>
</body>
</html>
