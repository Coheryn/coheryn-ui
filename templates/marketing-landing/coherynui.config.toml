# CoherynUI Project Configuration — Marketing Landing Starter

[compiler]
layer_prefix = "cyn"
variable_prefix = "cyn"
class_prefix = ""

[theme]
default = "dark"
available = ["dark", "light"]

[tokens.radius]
sm = "0.375rem"
lg = "0.75rem"
xl = "1rem"
full = "9999px"

[themes.dark.colors]
surface = "#07090e"
foreground = "#f8fafc"
brand = "#6366f1"

[themes.light.colors]
surface = "#ffffff"
foreground = "#0f172a"
brand = "#4f46e5"
