# CoherynUI Project Configuration — Multi-Theme Application Starter

[compiler]
layer_prefix = "cyn"
variable_prefix = "cyn"
class_prefix = ""

[theme]
default = "dark"
available = ["dark", "light", "cyberpunk", "nord"]

[tokens.radius]
sm = "0.375rem"
md = "0.5rem"
lg = "0.75rem"
xl = "1rem"

[themes.dark.colors]
surface = "#0f172a"
surface-elevated = "#1e293b"
foreground = "#f8fafc"
brand = "#6366f1"

[themes.light.colors]
surface = "#ffffff"
surface-elevated = "#f1f5f9"
foreground = "#0f172a"
brand = "#4f46e5"

[themes.cyberpunk.colors]
surface = "#0a0a12"
surface-elevated = "#151528"
foreground = "#00ffcc"
brand = "#ff007f"

[themes.nord.colors]
surface = "#2e3440"
surface-elevated = "#3b4252"
foreground = "#eceff4"
brand = "#88c0d0"
